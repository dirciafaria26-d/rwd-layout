
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>My Website</h1>
        </div>

        <div class="navigation">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

        <div class="main-content">
            <div class="content">
                <h2>Main Content</h2>
                <p>
                    Welcome to my responsive website.
                    This area contains the main information.
                </p>
                <p>
                    The layout adjusts automatically when
                    the screen size changes.
                </p>
            </div>

            <div class="sidebar">
                <h2>Sidebar</h2>
                <p>Additional information goes here.</p>
            </div>
        </div>

        <div class="footer">
            <p>Copyright &copy; 2026 My Website</p>
        </div>

    </div>

</body>
</html>
